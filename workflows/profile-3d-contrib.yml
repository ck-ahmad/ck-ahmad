name: 3D Github Contributions

on:
  schedule:
    - cron: "0 0 * * *"     # runs daily at midnight UTC
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          # Uses PROFILE_TOKEN if you've added one (see setup notes below),
          # otherwise falls back to the default GITHUB_TOKEN (public data only).
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A .
          git commit -m "chore: update 3D contribution graph" -a || echo "Nothing to commit"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

# ── Setup notes ──────────────────────────────────────────────────────────
# The graph will only be as real as the token behind it:
#
#   • Default GITHUB_TOKEN (no extra setup) → sees PUBLIC contributions only.
#     If most of your commits live in private repos, this is why the graph
#     looked generic/mostly-empty or didn't match your actual activity.
#
#   • For your FULL real picture (private + public), create a fine-grained
#     personal access token: Settings → Developer settings → Personal
#     access tokens → generate one with "repo" (Contents: Read) and
#     "read:user" scope → then add it to this repo as a secret named
#     PROFILE_TOKEN (Settings → Secrets and variables → Actions).
#     The workflow above already prefers PROFILE_TOKEN when present.
# ─────────────────────────────────────────────────────────────────────────
